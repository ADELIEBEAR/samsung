<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>관리자 업데이트 | 국장 통합 전략노트</title><link rel="stylesheet" href="assets/css/style.css"><script src="config.js"></script></head><body><main class="admin-shell"><a class="btn btn-secondary" href="index.html">← 공개 사이트로</a><section class="admin-card"><p class="eyebrow">Admin Only</p><h1>실시간 브리핑 업데이트</h1><p>이 페이지는 관리자용입니다. Gemini API 키는 여기에 입력하지 않습니다. API 키는 Cloudflare Worker의 Secret에만 저장합니다.</p><label for="apiBase">Worker API URL</label><input id="apiBase" placeholder="https://samsung-live-api.yourname.workers.dev"><label for="adminToken">관리자 토큰</label><input id="adminToken" type="password" placeholder="Cloudflare Worker ADMIN_TOKEN"><div class="admin-actions"><button class="btn btn-primary" id="saveSettings" type="button">설정 저장</button><button class="btn btn-secondary" id="loadLatest" type="button">현재 공개 브리핑 불러오기</button></div></section><section class="admin-card"><h2>Gemini로 오늘 브리핑 생성</h2><label for="tone">브리핑 톤</label><select id="tone"><option>전문가형이지만 초보자도 이해할 수 있게</option><option>짧고 강하게, 유튜브 마감 코멘트용</option><option>위험 관리 중심으로 보수적으로</option></select><label for="marketMemo">오늘 시장 메모</label><textarea id="marketMemo" placeholder="예: 코스피 흐름, 삼성전자 수급, 환율, 미국 반도체, 주요 뉴스, 강한 섹터 등을 입력하세요. Gemini는 Google Search grounding을 사용해 최신 정보 확인을 시도합니다."></textarea><label for="extraInstructions">추가 지시</label><textarea id="extraInstructions" placeholder="예: 삼성전자와 반도체 소부장 확산 여부를 더 강조해줘. 추천주처럼 보이지 않게 써줘."></textarea><div class="admin-actions"><button class="btn btn-primary" id="generateGemini" type="button">Gemini 분석 생성 + 공개 저장</button></div></section><section class="admin-card"><h2>공개될 JSON 미리보기</h2><textarea id="previewJson" placeholder="생성 결과가 여기에 표시됩니다. 직접 수정 후 수동 저장할 수도 있습니다."></textarea><div class="admin-actions"><button class="btn btn-secondary" id="publishManual" type="button">수동으로 공개 저장</button></div></section><section class="admin-card"><h2>작업 로그</h2><pre class="log" id="adminLog">대기 중</pre></section></main><script src="assets/js/admin.js"></script></body></html>
