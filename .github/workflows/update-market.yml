name: Update Daily Market Briefing

on:
  workflow_dispatch:
  schedule:
    # KST 08:10, 12:10, 15:10, 16:40 on Korean market weekdays
    - cron: "10 23 * * 0-4"
    - cron: "10 03 * * 1-5"
    - cron: "10 06 * * 1-5"
    - cron: "40 07 * * 1-5"

concurrency:
  group: market-data-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate publication safety
        run: node --test tests/*.test.js

      - name: Generate market briefing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/update-market.js

      - name: Commit validated data
        run: bash scripts/commit-data.sh data/today.json "Update daily market briefing"
