name: Validate publication safety
on:
  push:
    paths:
      - 'scripts/**'
      - 'assets/js/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'index.html'
      - 'live.html'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.js
      - run: bash -n scripts/commit-data.sh
